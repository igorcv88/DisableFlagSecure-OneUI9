name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.1.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run local unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintDebug
      - name: Compile unsigned debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
